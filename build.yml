name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PadMapper-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a release (easy download on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PadMapper.apk
          gh release create "build-${{ github.run_number }}" PadMapper.apk \
            --title "PadMapper build ${{ github.run_number }}" \
            --notes "Debug APK built automatically from the latest code." \
            --target "${{ github.sha }}"
